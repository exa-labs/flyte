name: Release Charts

on:
  push:
    branches:
      - master

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add required Helm repositories
        run: |
          helm repo add twun https://twuni.github.io/docker-registry.helm
          helm repo add kubernetes-dashboard https://kubernetes-retired.github.io/dashboard/
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Regenerate Helm repository index
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail

          rm -rf .cr-index .cr-release-packages
          mkdir -p .cr-release-packages

          while IFS=$'\t' read -r tag asset; do
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir .cr-release-packages \
              --clobber
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name as $tag | .assets[] | select(.name | endswith(".tgz")) | [$tag, .name] | @tsv'
          )

          repo="${GITHUB_REPOSITORY#*/}"
          cr index \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --git-repo "$repo" \
            --token "$CR_TOKEN" \
            --package-path .cr-release-packages \
            --index-path .cr-index/index.yaml \
            --remote origin \
            --pages-branch gh-pages \
            --pages-index-path index.yaml \
            --push
